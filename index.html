<!DOCTYPE html>
<html lang="pt-BR">
<head><script src="https://myhub.ia.br/canvas-vendor/tailwind.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#183047">
  <title>Catálogo Industrial</title>
  <style>
    :root {
      --navy: #183047;
      --navy-soft: #294761;
      --ink: #183047;
      --muted: #657b8f;
      --line: #dfe6ed;
      --page: #f2f5f8;
      --white: #fff;
      --green: #16836f;
      --red: #a13b35;
      --shadow: 0 12px 30px rgba(23, 45, 69, .09);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    .topbar {
      min-height: 72px;
      padding: 14px clamp(16px, 4vw, 42px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      background: var(--navy);
      color: var(--white);
    }

    .brand {
      margin: 0;
      font-size: clamp(19px, 4vw, 26px);
      font-weight: 800;
      letter-spacing: -.5px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #d5e1eb;
      font-size: 13px;
    }

    .top-actions button {
      border: 1px solid #587087;
      border-radius: 8px;
      padding: 8px 11px;
      background: transparent;
      color: white;
      font-weight: 700;
    }

    .page {
      width: min(1100px, 100%);
      margin: 0 auto;
      padding: 28px clamp(12px, 3vw, 28px) 48px;
    }

    .login-wrap {
      min-height: calc(100vh - 72px);
      display: grid;
      place-items: center;
      padding: 24px 12px;
    }

    .login-card, .form-panel, .catalog-panel, .sector-panel {
      border: 1px solid var(--line);
      border-radius: 17px;
      background: var(--white);
      box-shadow: var(--shadow);
    }

    .login-card {
      width: min(420px, 100%);
      padding: 25px;
    }

    .login-card h2 { margin: 0 0 7px; }
    .login-card p { margin: 0 0 20px; color: var(--muted); line-height: 1.5; }

    .login-form { display: grid; gap: 12px; }

    .login-form label, .form-group label {
      display: grid;
      gap: 6px;
      color: #40566a;
      font-size: 13px;
      font-weight: 700;
    }

    .login-form input, .form-group input, .form-group select, .form-group textarea,
    .search {
      width: 100%;
      min-height: 43px;
      border: 1px solid #d5dfe7;
      border-radius: 9px;
      padding: 10px 11px;
      color: var(--ink);
      background: var(--white);
      outline: none;
    }

    .login-form input:focus, .form-group input:focus, .form-group select:focus,
    .form-group textarea:focus, .search:focus {
      border-color: #55a997;
      box-shadow: 0 0 0 3px rgba(22, 131, 111, .12);
    }

    .primary-button {
      border: 0;
      border-radius: 10px;
      padding: 11px 14px;
      background: var(--green);
      color: var(--white);
      font-weight: 750;
    }

    .primary-button:hover { background: #126b5b; }
    .primary-button:disabled { opacity: .65; cursor: wait; }

    .message {
      display: none;
      margin: 14px 0 0;
      border-radius: 9px;
      padding: 10px 12px;
      background: #fff0ef;
      color: #922f2a;
      font-size: 13px;
      line-height: 1.45;
    }

    .message.show { display: block; }
    .message.success { background: #edf8f3; color: #17644e; }

    .intro { margin-bottom: 22px; }
    .intro h2 { margin: 0 0 7px; font-size: 23px; }
    .intro p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; }

    .sector-panel {
      padding: 21px;
      border: 0;
      background: var(--navy);
      color: var(--white);
    }

    .sector-panel h2 { margin: 0 0 15px; font-size: 19px; }

    .sector-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 11px;
    }

    .sector-card {
      min-height: 112px;
      border: 1px solid #3b5873;
      border-radius: 13px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      background: var(--navy-soft);
      color: var(--white);
      text-align: left;
    }

    .sector-card:hover { background: #355873; }
    .sector-name { margin-bottom: 10px; font-size: 18px; font-weight: 800; }
    .sector-count { color: #d3e1ec; font-size: 13px; }

    .catalog-panel {
      display: none;
      overflow: hidden;
    }

    .catalog-panel.open { display: block; }

    .catalog-head {
      padding: 18px;
      border-bottom: 1px solid var(--line);
    }

    .back-button, .secondary-button {
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 9px 12px;
      background: var(--white);
      color: var(--ink);
      font-weight: 700;
    }

    .back-button { margin-bottom: 14px; }
    .catalog-title { margin: 0 0 13px; font-size: 22px; }

    .catalog-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px 0;
      color: var(--muted);
      font-size: 13px;
    }

    .item-list { display: grid; gap: 9px; padding: 14px; }

    .item-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 13px;
      border: 1px solid #e6ebef;
      border-radius: 13px;
      background: var(--white);
    }

    .item-name { margin: 0 0 5px; font-size: 15px; line-height: 1.35; }
    .item-detail { margin: 3px 0 0; color: var(--muted); font-size: 12px; line-height: 1.4; overflow-wrap: anywhere; }

    .item-code {
      display: inline-block;
      margin-top: 7px;
      border-radius: 7px;
      padding: 5px 8px;
      background: #edf5f2;
      color: #155452;
      font-size: 12px;
      font-weight: 800;
    }

    .item-buttons { display: flex; flex-direction: column; gap: 6px; }

    .item-buttons button {
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 7px 9px;
      background: var(--white);
      color: var(--ink);
      font-size: 11px;
      font-weight: 700;
    }

    .item-buttons .delete { color: var(--red); }
    .empty { padding: 34px 16px; color: var(--muted); text-align: center; line-height: 1.5; }

    .form-panel {
      display: none;
      margin-top: 18px;
      padding: 18px;
    }

    .form-panel.open { display: block; }
    .form-title { margin: 0 0 15px; font-size: 19px; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .form-group { display: grid; gap: 6px; }
    .form-group.full { grid-column: 1 / -1; }
    .form-group textarea { min-height: 75px; resize: vertical; }

    .form-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 15px;
    }

    .notice {
      margin: 17px 4px 0;
      color: #68798a;
      font-size: 12px;
      line-height: 1.5;
    }

    .loading { padding: 35px 18px; color: var(--muted); text-align: center; }

    @media (max-width: 560px) {
      .topbar { align-items: flex-start; flex-direction: column; }
      .top-actions { width: 100%; justify-content: space-between; }
      .page { padding-top: 21px; }
      .sector-panel { padding: 17px; }
      .item-card { grid-template-columns: 1fr; }
      .item-buttons { flex-direction: row; }
      .catalog-actions { align-items: flex-start; flex-direction: column; }
      .form-grid { grid-template-columns: 1fr; }
      .form-group.full { grid-column: auto; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <h1 class="brand">Catálogo Industrial</h1>
    <div class="top-actions" id="topActions" hidden>
      <span id="signedInAs"></span>
      <button id="logoutButton" type="button">Sair</button>
    </div>
  </header>

  <main>
    <section class="login-wrap" id="loginPage">
      <div class="login-card">
        <h2>Entrar no catálogo</h2>
        <p>Acesse com o e-mail e a senha da sua conta do Supabase.</p>
        <form class="login-form" id="loginForm">
          <label for="emailInput">E-mail
            <input id="emailInput" type="email" autocomplete="username" value="matosmatheus059@gmail.com" required>
          </label>
          <label for="passwordInput">Senha
            <input id="passwordInput" type="password" autocomplete="current-password" required>
          </label>
          <button class="primary-button" id="loginButton" type="submit">Entrar</button>
        </form>
        <p class="message" id="loginMessage" role="status"></p>
      </div>
    </section>

    <main class="page" id="appPage" hidden>
      <section id="sectorsPage">
        <div class="intro">
          <h2>Setores</h2>
          <p>Escolha um setor para consultar e administrar as peças.</p>
        </div>
        <div class="sector-panel">
          <h2>Seus setores</h2>
          <div class="sector-grid" id="sectorGrid"></div>
        </div>
      </section>

      <section class="catalog-panel" id="catalogPage">
        <div class="catalog-head">
          <button class="back-button" id="backButton" type="button">← Voltar aos setores</button>
          <h2 class="catalog-title" id="catalogTitle"></h2>
          <input class="search" id="searchInput" type="search" placeholder="Pesquisar por nome, código ou equipamento..." aria-label="Pesquisar peças">
        </div>
        <div class="catalog-actions">
          <span id="resultCount"></span>
          <button class="primary-button" id="addMaterialButton" type="button">＋ Adicionar peça</button>
        </div>
        <div class="item-list" id="itemList"></div>
      </section>

      <section class="form-panel" id="materialFormPanel">
        <h2 class="form-title" id="formTitle">Adicionar peça</h2>
        <form id="materialForm">
          <div class="form-grid">
            <div class="form-group">
              <label for="materialName">Nome da peça *</label>
              <input id="materialName" maxlength="90" required placeholder="Ex.: Rolamento do volante">
            </div>
            <div class="form-group">
              <label for="materialCode">Código</label>
              <input id="materialCode" maxlength="40" placeholder="Ex.: 40491149">
            </div>
            <div class="form-group">
              <label for="materialSector">Setor *</label>
              <input id="materialSector" maxlength="40" required placeholder="Ex.: Farpado">
            </div>
            <div class="form-group">
              <label for="materialEquipment">Equipamento ou máquina</label>
              <input id="materialEquipment" maxlength="80" placeholder="Ex.: Farpado">
            </div>
            <div class="form-group">
              <label for="materialManufacturer">Fabricante ou modelo</label>
              <input id="materialManufacturer" maxlength="80" placeholder="Ex.: NPM">
            </div>
            <div class="form-group">
              <label for="materialPhotoUrl">Link da foto (opcional)</label>
              <input id="materialPhotoUrl" type="url" placeholder="https://...">
            </div>
            <div class="form-group full">
              <label for="materialNote">Observações</label>
              <textarea id="materialNote" maxlength="240" placeholder="Medida, aplicação ou outra informação útil"></textarea>
            </div>
          </div>
          <div class="form-footer">
            <button class="secondary-button" id="cancelMaterial" type="button">Cancelar</button>
            <button class="primary-button" id="saveMaterialButton" type="submit">Salvar peça</button>
          </div>
        </form>
        <p class="message" id="formMessage" role="status"></p>
      </section>

      <p class="notice">Os dados são guardados no Supabase. O acesso ao catálogo exige login.</p>
    </main>
  </main>

  <script>
    const SUPABASE_URL = "https://gvapfqcvnhrbearfheeq.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_fJ36i6hMxg_NthkNFf3Tvw_6RZ_k9eF";
    const OWNER_UID = "1e719569-14a3-43d5-8c4c-97d690946050";
    const TABLE = "Materiais";

    const DEFAULT_SECTORS = ["Farpado", "Trefila", "Galva", "Mecânica", "Elétrica", "Outros"];

    let accessToken = "";
    let currentUser = null;
    let materials = [];
    let selectedSector = "";
    let editingId = null;

    const loginPage = document.getElementById("loginPage");
    const appPage = document.getElementById("appPage");
    const sectorsPage = document.getElementById("sectorsPage");
    const catalogPage = document.getElementById("catalogPage");
    const materialFormPanel = document.getElementById("materialFormPanel");
    const sectorGrid = document.getElementById("sectorGrid");
    const itemList = document.getElementById("itemList");
    const searchInput = document.getElementById("searchInput");

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[character]);
    }

    function showMessage(element, text, success = false) {
      element.textContent = text;
      element.classList.toggle("success", success);
      element.classList.add("show");
    }

    function clearMessage(element) {
      element.textContent = "";
      element.classList.remove("show", "success");
    }

    function authHeaders() {
      return {
        "apikey": SUPABASE_PUBLISHABLE_KEY,
        "Authorization": `Bearer ${accessToken}`,
        "Content-Type": "application/json"
      };
    }

    async function supabaseRequest(path, options = {}) {
      const response = await fetch(`${SUPABASE_URL}${path}`, {
        ...options,
        headers: { ...authHeaders(), ...(options.headers || {}) }
      });

      if (!response.ok) {
        let details = "";
        try {
          const body = await response.json();
          details = body.message || body.error_description || body.error || "";
        } catch {}
        throw new Error(details || `Falha na solicitação (${response.status}).`);
      }

      if (response.status === 204) return null;
      return response.json();
    }

    async function signIn(email, password) {
      const response = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
        method: "POST",
        headers: {
          "apikey": SUPABASE_PUBLISHABLE_KEY,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ email, password })
      });

      const body = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(body.msg || body.message || body.error_description || "E-mail ou senha inválidos.");
      }
      return body;
    }

    async function signOut() {
      try {
        await fetch(`${SUPABASE_URL}/auth/v1/logout`, {
          method: "POST",
          headers: {
            "apikey": SUPABASE_PUBLISHABLE_KEY,
            "Authorization": `Bearer ${accessToken}`
          }
        });
      } catch {}
      accessToken = "";
      currentUser = null;
      materials = [];
      appPage.hidden = true;
      document.getElementById("topActions").hidden = true;
      loginPage.hidden = false;
      document.getElementById("passwordInput").value = "";
      clearMessage(document.getElementById("loginMessage"));
    }

    function showApp() {
      loginPage.hidden = true;
      appPage.hidden = false;
      document.getElementById("topActions").hidden = false;
      document.getElementById("signedInAs").textContent = currentUser?.email || "Conectado";
    }

    async function loadMaterials() {
      itemList.innerHTML = '<div class="loading">Carregando peças…</div>';
      const query = new URLSearchParams({
        select: "id,name,code,sector,equipment,manufacturer,note,photo_url,created_at,owner_id",
        owner_id: `eq.${OWNER_UID}`,
        order: "name.asc"
      });
      materials = await supabaseRequest(`/rest/v1/${encodeURIComponent(TABLE)}?${query.toString()}`);
      renderSectors();
      if (selectedSector) renderMaterials();
    }

    function getSectors() {
      const fromMaterials = materials.map(item => item.sector).filter(Boolean);
      return [...new Set([...DEFAULT_SECTORS, ...fromMaterials])].sort((a, b) => a.localeCompare(b, "pt-BR"));
    }

    function renderSectors() {
      const sectors = getSectors();
      sectorGrid.innerHTML = sectors.map(sector => {
        const count = materials.filter(item => item.sector === sector).length;
        return `
          <button class="sector-card" type="button" data-sector="${escapeHtml(sector)}">
            <span class="sector-name">${escapeHtml(sector)}</span>
            <span class="sector-count">${count} ${count === 1 ? "peça cadastrada" : "peças cadastradas"}</span>
          </button>`;
      }).join("");

      sectorGrid.querySelectorAll("[data-sector]").forEach(button => {
        button.addEventListener("click", () => openSector(button.dataset.sector));
      });
    }

    function openSector(sector) {
      selectedSector = sector;
      sectorsPage.hidden = true;
      catalogPage.classList.add("open");
      document.getElementById("catalogTitle").textContent = sector;
      searchInput.value = "";
      materialFormPanel.classList.remove("open");
      renderMaterials();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function showSectors() {
      selectedSector = "";
      catalogPage.classList.remove("open");
      sectorsPage.hidden = false;
      materialFormPanel.classList.remove("open");
      searchInput.value = "";
      renderSectors();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderMaterials() {
      const query = searchInput.value.trim().toLocaleLowerCase("pt-BR");
      const filtered = materials
        .filter(item => item.sector === selectedSector)
        .filter(item => `${item.name} ${item.code} ${item.equipment || ""} ${item.manufacturer || ""} ${item.note || ""}`
          .toLocaleLowerCase("pt-BR").includes(query))
        .sort((a, b) => a.name.localeCompare(b.name, "pt-BR"));

      document.getElementById("resultCount").textContent =
        `${filtered.length} ${filtered.length === 1 ? "peça encontrada" : "peças encontradas"}`;

      if (!filtered.length) {
        itemList.innerHTML = '<div class="empty">Nenhuma peça encontrada neste setor.<br>Use “Adicionar peça” para cadastrar uma.</div>';
        return;
      }

      itemList.innerHTML = filtered.map(item => `
        <article class="item-card">
          <div>
            <h3 class="item-name">${escapeHtml(item.name)}</h3>
            <p class="item-detail">${escapeHtml(item.sector)}${item.equipment ? ` · ${escapeHtml(item.equipment)}` : ""}</p>
            ${item.manufacturer ? `<p class="item-detail">Fabricante/modelo: ${escapeHtml(item.manufacturer)}</p>` : ""}
            ${item.note ? `<p class="item-detail">${escapeHtml(item.note)}</p>` : ""}
            ${item.photo_url ? `<p class="item-detail"><a href="${escapeHtml(item.photo_url)}" target="_blank" rel="noopener noreferrer">Abrir foto</a></p>` : ""}
            <span class="item-code">${item.code ? `Código: ${escapeHtml(item.code)}` : "Código não informado"}</span>
          </div>
          <div class="item-buttons">
            <button type="button" data-edit="${escapeHtml(item.id)}">Editar</button>
            <button class="delete" type="button" data-delete="${escapeHtml(item.id)}">Excluir</button>
          </div>
        </article>`).join("");

      itemList.querySelectorAll("[data-edit]").forEach(button => {
        button.addEventListener("click", () => editMaterial(button.dataset.edit));
      });
      itemList.querySelectorAll("[data-delete]").forEach(button => {
        button.addEventListener("click", () => deleteMaterial(button.dataset.delete));
      });
    }

    function resetMaterialForm() {
      document.getElementById("materialForm").reset();
      editingId = null;
      document.getElementById("formTitle").textContent = "Adicionar peça";
      document.getElementById("saveMaterialButton").textContent = "Salvar peça";
      clearMessage(document.getElementById("formMessage"));
    }

    function openMaterialForm(item = null) {
      resetMaterialForm();
      if (item) {
        editingId = item.id;
        document.getElementById("formTitle").textContent = "Editar peça";
        document.getElementById("saveMaterialButton").textContent = "Salvar alterações";
        document.getElementById("materialName").value = item.name || "";
        document.getElementById("materialCode").value = item.code || "";
        document.getElementById("materialSector").value = item.sector || selectedSector;
        document.getElementById("materialEquipment").value = item.equipment || "";
        document.getElementById("materialManufacturer").value = item.manufacturer || "";
        document.getElementById("materialPhotoUrl").value = item.photo_url || "";
        document.getElementById("materialNote").value = item.note || "";
      } else {
        document.getElementById("materialSector").value = selectedSector;
      }

      materialFormPanel.classList.add("open");
      document.getElementById("materialName").focus();
      materialFormPanel.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function editMaterial(id) {
      const item = materials.find(material => String(material.id) === String(id));
      if (item) openMaterialForm(item);
    }

    async function deleteMaterial(id) {
      const item = materials.find(material => String(material.id) === String(id));
      if (!item || !confirm(`Excluir “${item.name}” do catálogo?`)) return;

      try {
        const query = new URLSearchParams({
          id: `eq.${id}`,
          owner_id: `eq.${OWNER_UID}`
        });
        await supabaseRequest(`/rest/v1/${encodeURIComponent(TABLE)}?${query.toString()}`, {
          method: "DELETE"
        });
        await loadMaterials();
      } catch (error) {
        alert(`Não foi possível excluir a peça: ${error.message}`);
      }
    }

    document.getElementById("loginForm").addEventListener("submit", async event => {
      event.preventDefault();
      const button = document.getElementById("loginButton");
      const message = document.getElementById("loginMessage");
      clearMessage(message);
      button.disabled = true;
      button.textContent = "Entrando…";

      try {
        const result = await signIn(
          document.getElementById("emailInput").value.trim(),
          document.getElementById("passwordInput").value
        );
        accessToken = result.access_token;
        currentUser = result.user;

        if (currentUser?.id !== OWNER_UID) {
          await signOut();
          throw new Error("Esta conta não é a autorizada para acessar este catálogo.");
        }

        showApp();
        await loadMaterials();
      } catch (error) {
        showMessage(message, error.message || "Não foi possível entrar.");
      } finally {
        button.disabled = false;
        button.textContent = "Entrar";
      }
    });

    document.getElementById("logoutButton").addEventListener("click", signOut);

    document.getElementById("backButton").addEventListener("click", showSectors);

    document.getElementById("addMaterialButton").addEventListener("click", () => openMaterialForm());

    document.getElementById("cancelMaterial").addEventListener("click", () => {
      materialFormPanel.classList.remove("open");
      resetMaterialForm();
    });

    searchInput.addEventListener("input", renderMaterials);

    document.getElementById("materialForm").addEventListener("submit", async event => {
      event.preventDefault();
      const message = document.getElementById("formMessage");
      const saveButton = document.getElementById("saveMaterialButton");
      clearMessage(message);
      saveButton.disabled = true;

      const record = {
        name: document.getElementById("materialName").value.trim(),
        code: document.getElementById("materialCode").value.trim(),
        sector: document.getElementById("materialSector").value.trim(),
        equipment: document.getElementById("materialEquipment").value.trim() || null,
        manufacturer: document.getElementById("materialManufacturer").value.trim() || null,
        photo_url: document.getElementById("materialPhotoUrl").value.trim() || null,
        note: document.getElementById("materialNote").value.trim() || null,
        owner_id: OWNER_UID
      };

      if (!record.name || !record.sector) {
        showMessage(message, "Preencha o nome da peça e o setor.");
        saveButton.disabled = false;
        return;
      }

      try {
        if (editingId) {
          const query = new URLSearchParams({
            id: `eq.${editingId}`,
            owner_id: `eq.${OWNER_UID}`
          });
          await supabaseRequest(`/rest/v1/${encodeURIComponent(TABLE)}?${query.toString()}`, {
            method: "PATCH",
            headers: { "Prefer": "return=minimal" },
            body: JSON.stringify(record)
          });
        } else {
          await supabaseRequest(`/rest/v1/${encodeURIComponent(TABLE)}`, {
            method: "POST",
            headers: { "Prefer": "return=minimal" },
            body: JSON.stringify(record)
          });
        }

        selectedSector = record.sector;
        await loadMaterials();
        document.getElementById("catalogTitle").textContent = selectedSector;
        catalogPage.classList.add("open");
        sectorsPage.hidden = true;
        materialFormPanel.classList.remove("open");
        resetMaterialForm();
      } catch (error) {
        showMessage(message, `Não foi possível salvar. ${error.message}`);
      } finally {
        saveButton.disabled = false;
      }
    });
  </script>
</body>
</html>
